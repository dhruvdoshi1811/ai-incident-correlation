services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: incident_copilot
      POSTGRES_USER: incident_copilot
      POSTGRES_PASSWORD: incident_copilot
    ports:
      - "5432:5432"
    volumes:
      - incident-copilot-pgdata:/var/lib/postgresql/data

volumes:
  incident-copilot-pgdata:
