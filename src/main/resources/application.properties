spring.application.name=incident-copilot

spring.datasource.url=jdbc:postgresql://localhost:5432/incident_copilot
spring.datasource.username=incident_copilot
spring.datasource.password=incident_copilot

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

jwt.secret=this-is-a-development-only-secret-key-change-in-production
jwt.expiration-ms=86400000

# chat/LLM analysis is Phase C's concern - stays disabled until then
spring.ai.model.chat=none
# talking to pgvector directly via native queries on alerts, not through Spring AI's VectorStore abstraction
spring.autoconfigure.exclude=org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration

spring.ai.model.embedding=google-genai
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.text.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.dimensions=768

correlation.similarity-threshold=0.15

app.admin.email=admin@incident-copilot.local
app.admin.password=change-me-admin
