spring.application.name=incident-copilot

server.port=${PORT:8080}
management.endpoints.web.exposure.include=health

spring.datasource.url=jdbc:postgresql://localhost:5432/incident_copilot
spring.datasource.username=incident_copilot
spring.datasource.password=incident_copilot

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

jwt.secret=this-is-a-development-only-secret-key-change-in-production
jwt.expiration-ms=86400000

# talking to pgvector directly via native queries on alerts/postmortems, not through Spring AI's VectorStore abstraction
spring.autoconfigure.exclude=org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration

spring.ai.model.embedding=google-genai
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.text.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.dimensions=768

spring.ai.model.chat=google-genai
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.5-flash-lite

correlation.similarity-threshold=0.15
postmortem.retrieval.top-k=3

app.admin.email=admin@incident-copilot.local
app.admin.password=change-me-admin

analysis.llm-call-timeout-seconds=15
analysis.debounce-window-seconds=30
analysis.debounce-check-interval-seconds=10

resilience4j.circuitbreaker.instances.llmCall.sliding-window-size=10
resilience4j.circuitbreaker.instances.llmCall.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.llmCall.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.llmCall.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.llmCall.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.llmCall.automatic-transition-from-open-to-half-open-enabled=true

resilience4j.ratelimiter.instances.llmCall.limit-for-period=10
resilience4j.ratelimiter.instances.llmCall.limit-refresh-period=1m
resilience4j.ratelimiter.instances.llmCall.timeout-duration=0s

notification.default-channel=SLACK
notification.webhook-url=http://localhost:8080/demo/mock-webhook
notification.publish-interval-seconds=10
notification.max-attempts=5
notification.backoff-base-seconds=10
notification.backoff-max-seconds=300
